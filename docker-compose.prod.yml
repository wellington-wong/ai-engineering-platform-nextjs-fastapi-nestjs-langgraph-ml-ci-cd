version: '3.9'

services:

    notes:
      build: ./backend/notes
      restart: unless-stopped
      ports:
        - 8000:8000
      environment:
        DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@db:5432/notesdb
        OPENAI_API_KEY: ${OPENAI_API_KEY}
      depends_on:
          
        db:
          condition: service_healthy


    agent:
      build: ./backend/agent
      restart: unless-stopped

      ports:

        - "8001:8000"

      environment:
        DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@db:5432/agentdb
        OPENAI_API_KEY: ${OPENAI_API_KEY}
        PROJECT_NAME: "AI Agent Tools Core"

        SECRET_KEY: changethis


        FIRST_SUPERUSER: admin@example.com

        FIRST_SUPERUSER_PASSWORD: changethis



      depends_on:
        db:
          condition: service_healthy


    ml-service:
      build: ./backend/ml-service
      restart: unless-stopped
      expose:
        - "8000"

      networks:
        - default

        - shared-backend

    db:
      image: postgres:16
      
      restart: unless-stopped  

      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: notesdb
      volumes:
        - postgres_data:/var/lib/postgresql/data

      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d notesdb"]
        interval: 5s
        timeout: 5s
        retries: 5

volumes:
  postgres_data:

networks:
  default:
  shared-backend:

    external: true


    name: shared-backend