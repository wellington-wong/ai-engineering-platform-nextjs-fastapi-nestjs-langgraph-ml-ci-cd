name: Deploy Backend

on:

  push:
    branches:
      - master

    paths:
      - 'backend/**'

concurrency:
  group: production-deploy

  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy files to server
        run: |
          rsync -avz --delete \
            --no-owner \
            --no-group \
            --exclude '.env' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'frontend' \
            --exclude 'observability' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/apps/notes-app



      - name: Deploy with Docker Compose

        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ~/apps/notes-app


            printf "OPENAI_API_KEY=%s\nPOSTGRES_PASSWORD=%s\n" \
            "${{ secrets.OPENAI_API_KEY }}" \
            "${{ secrets.POSTGRES_PASSWORD }}" > .env

            chmod 600 .env

            docker compose -f docker-compose.prod.yml up -d --build notes agent ml-service
            docker system prune -af
            sleep 5


            
            #docker compose -f docker-compose.prod.yml exec -T notes \
            #python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
          EOF


